<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Scanner</title>
  <style>
    :root { --bg: #0f131b; --card: #181e2a; --line: #2a3243; --fg: #f2f4f8; --mut: #98a2b6; --ok: #1f9d55; --warn: #d98a00; --bad: #c93a3a; --accent: #4c8dff; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; min-height: 100%; }
    body { background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
    /* Screen-edge flash that shows the scan result from a distance */
    body::after { content: ""; position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 0 0 transparent; transition: box-shadow .15s; }
    body.f-ok::after { box-shadow: inset 0 0 0 10px var(--ok); }
    body.f-already::after { box-shadow: inset 0 0 0 10px var(--warn); }
    body.f-invalid::after, body.f-denied::after, body.f-error::after { box-shadow: inset 0 0 0 10px var(--bad); }
    .wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    h1 { font-size: 22px; margin: 8px 0 0; }
    p.lead { margin: 0; color: var(--mut); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
    label { display: block; color: var(--mut); font-size: 14px; margin-bottom: 6px; }
    .field { margin-bottom: 14px; }
    input { width: 100%; padding: 13px 14px; border-radius: 10px; border: 1px solid var(--line); background: #0f131b; color: var(--fg); font: inherit; }
    input::placeholder { color: #6b7488; }
    button { padding: 13px 18px; border: 0; border-radius: 10px; font: inherit; font-weight: 600; cursor: pointer; background: var(--line); color: var(--fg); }
    button.primary { background: var(--accent); color: #fff; width: 100%; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    #count { font-size: 24px; font-weight: 800; }
    .prog { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
    .prog i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .3s; }
    .meta { display: flex; gap: 8px; flex-wrap: wrap; min-height: 26px; }
    .pill { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--line); color: var(--mut); }
    .pill.good { background: #163d28; color: #7fe0a8; }
    .pill.warn { background: #4a3500; color: #ffc861; }
    .pill.bad { background: #4d1b1b; color: #ffb4b4; }
    .frame { position: relative; border-radius: 14px; overflow: hidden; background: #000; border: 1px solid var(--line); aspect-ratio: 1/1; max-height: 38vh; margin: 0 auto; width: 100%; min-height: 200px; }
    #reader { width: 100%; height: 100%; }
    #reader video { width: 100% !important; height: 100% !important; object-fit: cover; }
    #reader img { display: none; }
    /* Corner guide: square, centered, 70% of the frame height (matches the scan box) */
    .guide { position: absolute; top: 50%; left: 50%; height: 70%; aspect-ratio: 1; transform: translate(-50%, -50%); pointer-events: none; }
    .guide span { position: absolute; width: 26px; height: 26px; border: 4px solid #fff; opacity: .9; }
    .guide .a { top: 0; left: 0; border-right: 0; border-bottom: 0; border-radius: 8px 0 0 0; }
    .guide .b { top: 0; right: 0; border-left: 0; border-bottom: 0; border-radius: 0 8px 0 0; }
    .guide .c { bottom: 0; left: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 8px; }
    .guide .d { bottom: 0; right: 0; border-left: 0; border-top: 0; border-radius: 0 0 8px 0; }
    #cam { margin: 0; color: var(--mut); font-size: 14px; text-align: center; min-height: 20px; }
    #cam.err { color: #ffb4b4; }
    /* Fixed height so the layout never jumps between scans */
    #status { height: 156px; border-radius: 14px; padding: 12px 16px; text-align: center; background: var(--card); border: 1px solid var(--line); display: flex; flex-direction: column; justify-content: center; overflow: hidden; transition: background .15s; }
    #status.ok { background: var(--ok); border-color: var(--ok); }
    #status.already { background: var(--warn); border-color: var(--warn); }
    #status.invalid, #status.denied, #status.error { background: var(--bad); border-color: var(--bad); }
    #lab { font-size: 15px; font-weight: 700; margin: 0; }
    #lab:empty { display: none; }
    #big { font-size: 32px; font-weight: 800; line-height: 1.15; margin: 2px 0 4px; overflow-wrap: anywhere; }
    #sub { font-size: 17px; margin: 0; color: #e6e9f0; overflow-wrap: anywhere; }
    #big, #sub { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
    form { display: flex; gap: 8px; }
    form input { flex: 1; min-width: 0; }
    #retry { width: 100%; }
    @media (min-width: 700px) {
      body { padding-top: 32px; }
      .frame { max-height: 420px; }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <section id="setup" hidden>
      <h1>Connect the scanner</h1>
      <h3>Bishal Regmi</h3>
      <p class="lead">Enter these once. They are saved on this device.</p>
      <div class="card">
        <div class="field">
          <label for="url">Web app URL</label>
          <input id="url" type="url" inputmode="url" autocapitalize="off" autocomplete="off" placeholder="https://script.google.com/macros/s/.../exec">
        </div>
        <div class="field">
          <label for="key">Staff key</label>
          <input id="key" type="password" autocapitalize="off" autocomplete="off" placeholder="key">
        </div>
        <div class="field">
          <label for="by">Your name</label>
          <input id="by" autocomplete="off" placeholder="Enter Your Name">
        </div>
        <button class="primary" id="save">Start scanning</button>
      </div>
    </section>

    <section id="app" hidden>
      <div class="wrap">
        <div class="bar">
          <strong id="count">Loading…</strong>
          <button id="reset">Settings</button>
        </div>
        <div class="prog"><i id="pg"></i></div>
        <div class="meta">
          <span id="snd" class="pill warn">Touch the screen to enable voice</span>
          <span id="net" class="pill" hidden></span>
        </div>
        <div class="frame">
          <div id="reader"></div>
          <div class="guide"><span class="a"></span><span class="b"></span><span class="c"></span><span class="d"></span></div>
        </div>
        <p id="cam"></p>
        <button id="retry" hidden>Retry camera</button>
        <div id="status">
          <p id="lab"></p>
          <p id="big">Ready</p>
          <p id="sub">Point the camera at a ticket</p>
        </div>
        <form id="manual">
          <input id="code" placeholder="Or type the ticket code" autocomplete="off" autocapitalize="off">
          <button type="submit">Check</button>
        </form>
      </div>
    </section>

  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <script>
    var cfg = {};
    try {
      cfg = JSON.parse(localStorage.getItem('cfg') || '{}');
    } catch (e) {}

    var $ = function (id) {
      return document.getElementById(id);
    };

    var busy = false, scanner = null, booted = false, unlocked = false, audioCtx = null, vc = null, wake = null;
    var list = null, total = 0, inCount = 0, queue = [], sending = false, dirty = false, offline = false;
    var resetT = null, lastTok = '', lastAt = 0;
    var CAN_SPEAK = !!window.speechSynthesis;
    var TITLES = { mr: 'Mister', mrs: 'Missus', ms: 'Mizz', dr: 'Doctor' };

    // ---------- VOICE ----------
    // Titles are changed only when spoken. The Sheet still shows Mr / Ms / Mrs / Dr.
    function spoken(name) {
      return String(name || '').replace(/\b(mrs|mr|ms|dr)\b\.?/gi, function (m, t) {
        return TITLES[t.toLowerCase()];
      });
    }

    if (CAN_SPEAK) speechSynthesis.onvoiceschanged = function () { vc = null; };

    // Female English voice first. If the phone has none, the phone's default voice is used.
    function pickVoice() {
      if (vc) return vc;
      var f = speechSynthesis.getVoices().filter(function (v) {
        return /^en/i.test(v.lang) && /female|zira|samantha|susan|karen|moira|tessa|fiona|victoria|hazel|google us english/i.test(v.name);
      });
      return (vc = f[0] || null);
    }

    function speak(text) {
      if (!CAN_SPEAK) return;
      try {
        speechSynthesis.cancel();                 // a new scan cuts off the old voice
        var u = new SpeechSynthesisUtterance(text);
        var v = pickVoice();
        if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
        speechSynthesis.speak(u);
      } catch (e) {}
    }

    function setSnd() {
      var e = $('snd');
      if (!CAN_SPEAK) { e.textContent = 'Voice not supported in this browser'; e.className = 'pill bad'; return; }
      e.textContent = unlocked ? 'Voice on' : 'Touch the screen to enable voice';
      e.className = 'pill ' + (unlocked ? 'good' : 'warn');
    }

    // Phones allow sound only after a touch. The first touch anywhere unlocks voice and beeps.
    function unlock() {
      if (unlocked) return;
      try {
        if (CAN_SPEAK) {
          var u = new SpeechSynthesisUtterance(' ');   // silent warm-up so the first real scan is fast
          u.volume = 0;
          speechSynthesis.speak(u);
          speechSynthesis.getVoices();
        }
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC && !audioCtx) audioCtx = new AC();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        unlocked = true;
      } catch (e) {}
      setSnd();
    }
    ['pointerdown', 'touchstart', 'click', 'keydown'].forEach(function (ev) {
      document.addEventListener(ev, unlock, { passive: true });
    });

    // Beeps are used only for results that are not spoken (invalid ticket, wrong key, no connection).
    var ERR_BEEP = {
      invalid: [{ f: 300, d: 0.08 }, { f: 300, d: 0.08 }, { f: 300, d: 0.08 }],
      denied: [{ f: 220, d: 0.1 }, { f: 220, d: 0.1 }, { f: 220, d: 0.1 }],
      error: [{ f: 220, d: 0.12 }, { f: 220, d: 0.12 }]
    };

    function beep(pattern) {
      try {
        if (!audioCtx) {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          audioCtx = new AC();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        var t = audioCtx.currentTime;
        pattern.forEach(function (p) {
          var o = audioCtx.createOscillator(), g = audioCtx.createGain();
          o.type = 'square';
          o.frequency.value = p.f;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.25, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t + p.d);
          o.connect(g).connect(audioCtx.destination);
          o.start(t);
          o.stop(t + p.d + 0.01);
          t += p.d + 0.06;
        });
      } catch (e) {}
    }

    function vibrateFor(k) {
      if (!navigator.vibrate) return;
      navigator.vibrate(k === 'ok' ? 80 : k === 'already' ? [150, 80, 150] : k === 'invalid' ? [80, 60, 80, 60, 80] : [120, 80, 120]);
    }

    // ---------- SETUP ----------
    function show() {
      var ready = cfg.url && cfg.key;
      $('setup').hidden = !!ready;
      $('app').hidden = !ready;
      if (ready) {
        setSnd();
        boot();
        // Wait one animation frame so #app/#reader have real size before the camera starts.
        requestAnimationFrame(function () {
          setTimeout(start, 50);
        });
      } else {
        $('url').value = cfg.url || '';
        $('key').value = cfg.key || '';
        $('by').value = cfg.by || '';
      }
    }

    $('save').onclick = function () {
      unlock();
      cfg = { url: $('url').value.trim(), key: $('key').value.trim(), by: $('by').value.trim() };
      try {
        localStorage.setItem('cfg', JSON.stringify(cfg));
      } catch (e) {}
      show();
    };

    $('reset').onclick = function () {
      var keep = cfg;
      try {
        localStorage.setItem('cfg', JSON.stringify({ url: keep.url, by: keep.by }));
      } catch (e) {}
      location.reload();
    };

    function call(params) {
      var q = Object.keys(params).map(function (k) {
        return k + '=' + encodeURIComponent(params[k]);
      }).join('&');
      return fetch(cfg.url + '?key=' + encodeURIComponent(cfg.key) + '&' + q).then(function (r) {
        return r.json();
      });
    }

    // ---------- Instant scan: list kept in memory, saves go to the Sheet in the background ----------
    function qkey() {
      return 'queue:' + (cfg.url || '');
    }

    function saveQueue() {
      try {
        localStorage.setItem(qkey(), JSON.stringify(queue));
      } catch (e) {}
    }

    // Same format as the Sheet: yyyy-MM-dd hh:mm:ss AM (Nepal time)
    function clock() {
      var d = new Date();
      return d.toLocaleDateString('en-CA', { timeZone: 'Asia/Kathmandu' }) + ' ' +
        d.toLocaleTimeString('en-US', { timeZone: 'Asia/Kathmandu', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true }).replace(/\u202f/g, ' ');
    }

    function showCount() {
      if (!list) return;
      $('count').textContent = inCount + ' in, ' + (total - inCount) + ' to go';
      $('pg').style.width = (total ? inCount / total * 100 : 0) + '%';
      var n = $('net');
      if (queue.length) {
        n.hidden = false;
        n.className = 'pill ' + (offline ? 'bad' : 'warn');
        n.textContent = offline ? 'Offline, ' + queue.length + ' waiting' : 'Saving ' + queue.length;
      } else {
        n.hidden = true;
      }
    }

    function applyList(rows) {
      var m = {}, n = 0;
      rows.forEach(function (r) {
        m[String(r[0]).toLowerCase()] = { n: r[1], d: r[2], o: r[3], t: r[4] };
        if (r[4]) n++;
      });
      queue.forEach(function (q) {
        var x = m[q.code.toLowerCase()];
        if (x && !x.t) {
          x.t = q.time || 'earlier';
          n++;
        }
      });
      list = m;
      total = rows.length;
      inCount = n;
      showCount();
    }

    function sync() {
      if (list && (queue.length || sending)) return;
      dirty = false;
      call({ action: 'list' }).then(function (r) {
        if (r.result === 'denied') {
          $('count').textContent = 'Wrong staff key';
          return;
        }
        if (r.result !== 'list') return;
        if (list && (dirty || queue.length)) return;
        applyList(r.rows);
      }).catch(function () {
        if (!list) $('count').textContent = 'Offline';
      });
    }

    // Runs once. Starts the saved queue and a 10 second sync so two phones stay close together.
    function boot() {
      if (booted) return;
      booted = true;
      try {
        queue = JSON.parse(localStorage.getItem(qkey()) || '[]');
      } catch (e) {
        queue = [];
      }
      sync();
      flush();
      setInterval(sync, 10000);
    }

    function setStatus(cls, lab, big, sub) {
      $('status').className = cls;
      $('lab').textContent = lab;
      $('big').textContent = big;
      $('sub').textContent = sub;
      document.body.className = cls ? 'f-' + cls : '';
    }

    function result(r) {
      var who = [r.designation, r.organization].filter(Boolean).join(', ');
      var map = {
        ok: ['Welcome', r.name || '', who],
        already: [r.dup ? 'Duplicate, already entered' : 'Already checked in', r.name || '', 'Came in at ' + (r.checkedInAt || 'earlier')],
        invalid: ['', 'Not a valid ticket', 'Check the code and try again'],
        denied: ['', 'Wrong staff key', 'Tap Settings and enter it again'],
        error: ['', 'No connection', 'Check the internet and try again']
      };
      var k = map[r.result] ? r.result : 'error', m = map[k];
      setStatus(k, m[0], m[1], m[2]);
      if (k === 'ok') speak('Welcome, ' + spoken(r.name));
      else if (k === 'already') speak('Already checked in');
      else beep(ERR_BEEP[k]);
      vibrateFor(k);
      clearTimeout(resetT);
      resetT = setTimeout(function () {
        setStatus('', '', 'Ready', 'Point the camera at a ticket');
      }, 2500);
      setTimeout(function () {
        busy = false;
      }, 500);
    }

    function flush() {
      if (sending || !queue.length) return;
      sending = true;
      var q = queue[0];
      call({ action: 'scan', token: q.code, by: q.by }).then(function (r) {
        offline = false;
        if (r.result === 'denied') {
          sending = false;
          showCount();
          result(r);
          return;
        }
        queue.shift();
        saveQueue();
        dirty = true;
        if (r.result === 'already') {
          // Another phone entered this person first
          var p = list && list[q.code.toLowerCase()];
          if (p && r.checkedInAt) p.t = r.checkedInAt;
          result({ result: 'already', name: r.name, checkedInAt: r.checkedInAt, dup: true });
        } else if (r.result !== 'ok') {
          setStatus('error', '', 'Not saved', 'Ticket ' + q.code + ' was not found');
          beep(ERR_BEEP.error);
          vibrateFor('error');
        }
        sending = false;
        showCount();
        flush();
      }).catch(function () {
        offline = true;
        sending = false;
        showCount();
        setTimeout(flush, 5000);
      });
    }

    function slowCheck(code) {
      setStatus('', '', 'Checking…', 'Please wait');
      call({ action: 'scan', token: code, by: cfg.by || '' }).then(function (r) {
        var p = list && list[code.toLowerCase()];
        if (r.result === 'ok' && p && !p.t) {
          p.t = clock();
          inCount++;
          showCount();
        }
        result(r);
      }).catch(function () {
        result({ result: 'error' });
      });
    }

    function check(raw) {
      var code = String(raw || '').split('|').pop().trim();
      var now = Date.now();
      if (busy || !code || (code === lastTok && now - lastAt < 4000)) return;
      lastTok = code;
      lastAt = now;
      busy = true;
      var p = list && list[code.toLowerCase()];
      if (!p) return slowCheck(code);
      if (p.t) {
        result({ result: 'already', name: p.n, checkedInAt: p.t });
        return;
      }
      p.t = clock();
      inCount++;
      dirty = true;
      result({ result: 'ok', name: p.n, designation: p.d, organization: p.o });
      queue.push({ code: code, by: cfg.by || '', time: p.t });
      saveQueue();
      showCount();
      flush();
    }

    // ---------- Camera: real checks, clear errors, retry, restart after screen lock ----------
    function camFail(msg) {
      $('cam').textContent = msg;
      $('cam').classList.add('err');
      $('retry').hidden = false;
    }

    function keepAwake() {
      try {
        if (navigator.wakeLock && document.visibilityState === 'visible') {
          navigator.wakeLock.request('screen').then(function (w) {
            wake = w;
          }).catch(function () {});
        }
      } catch (e) {}
    }

    function start() {
      if (scanner) return;
      $('cam').classList.remove('err');
      $('cam').textContent = 'Starting camera…';
      $('retry').hidden = true;

      if (!window.isSecureContext) {
        camFail('Camera needs HTTPS. Open this page from an https:// address (not file:// and not http://).');
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        camFail('This browser does not support the camera. Use Chrome on Android or Safari on iOS, over HTTPS.');
        return;
      }
      if (typeof Html5Qrcode === 'undefined') {
        camFail('Scanner library did not load. Check the internet and reload the page.');
        return;
      }

      scanner = new Html5Qrcode('reader', {
        formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
        experimentalFeatures: { useBarCodeDetectorIfSupported: true }
      });

      var box = function (w, h) {
        var s = Math.floor(Math.min(w, h) * 0.7);
        return { width: s, height: s };
      };

      scanner.start(
        { facingMode: 'environment' },
        { fps: 15, qrbox: box, aspectRatio: 1, disableFlip: true },
        check,
        function () {}
      ).then(function () {
        $('cam').textContent = 'Point the camera at a ticket';
        $('cam').classList.remove('err');
        $('retry').hidden = true;
        keepAwake();
      }).catch(function (err) {
        var name = (err && err.name) || '';
        var msg;
        if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
          msg = 'Camera permission was denied. Tap the lock icon in the address bar, then Site settings, Camera, Allow. Then tap Retry.';
        } else if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
          msg = 'No camera found on this device.';
        } else if (name === 'NotReadableError' || name === 'TrackStartError') {
          msg = 'Camera is being used by another app. Close other camera apps and tap Retry.';
        } else if (name === 'OverconstrainedError') {
          msg = 'Camera does not support the requested mode. Tap Retry.';
        } else if (name === 'SecurityError') {
          msg = 'Camera blocked by the browser. Make sure the page is on HTTPS.';
        } else {
          msg = 'Camera failed: ' + (err && err.message ? err.message : name || 'unknown error') + '. Tap Retry.';
        }
        camFail(msg);
        scanner = null;
      });
    }

    // Stops the old camera (if any) and starts a fresh one. Used by Retry and when the phone wakes up.
    function restartCam() {
      var s = scanner;
      scanner = null;
      if (!s) return start();
      Promise.resolve().then(function () {
        return s.stop();
      }).catch(function () {}).then(function () {
        try { s.clear(); } catch (e) {}
        start();
      });
    }

    $('retry').onclick = restartCam;

    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState !== 'visible' || $('app').hidden) return;
      keepAwake();
      restartCam();
    });

    $('manual').onsubmit = function (e) {
      e.preventDefault();
      check($('code').value.trim());
      $('code').value = '';
    };

    show();
  </script>
</body>

</html>
